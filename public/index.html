<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dog Breeds</title>
</head>
<body>

    <h1>Lista de Raças de Cães</h1>

    <!-- Botão para carregar todas as raças -->
    <button id="loadAll">Carregar todas as raças</button>

    <!-- Campo para buscar por ID -->
    <div>
        <input type="number" id="dogId" placeholder="Digite o ID da raça">
        <button id="loadById">Buscar por ID</button>
    </div>

    <!-- Área onde os dados serão exibidos -->
    <div id="result"></div>

    <script src="script.js"></script>
</body>
</html>
